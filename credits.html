<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credits - Tuff Stuff</title>
<link rel="stylesheet" href="style.css">
<header>
  <a class="logo" href="./">TUFF <span>STUFF</span></a>
  <nav><a href="./">Games</a><a href="credits.html">Credits</a></nav>
</header>
<main class="credits">
  <h1>Credits</h1>
  <p class="sub">Every game here hosted here is open source and is hosted under its licence. Thank you to their makers.</p>
  <ul id="list"></ul>
</main>
<script src="games.js"></script>
<script>
  document.getElementById('list').innerHTML = GAMES.map((g) => g.link ? `
    <li><b>${g.name}</b> by ${g.author}. Not hosted here: the card links to the official game at
      <a href="${g.link}" target="_blank" rel="noopener">${g.link.replace('https://', '')}</a>.</li>` : `
    <li><b>${g.name}</b> by ${g.author}. Licence: ${g.license}
      (<a href="games/${g.slug}/${g.licenseFile || 'LICENSE.txt'}">licence text</a>).
      Source code: <a href="${g.source}" target="_blank" rel="noopener">${g.source.replace('https://', '')}</a>${g.extra ? '<br>' + g.extra : ''}</li>`).join('');
</script>
</html>
