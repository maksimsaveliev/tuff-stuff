<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tuff Stuff Games</title>
<link rel="stylesheet" href="style.css">
<header>
  <a class="logo" href="./">TUFF STUFF<span>GAMES</span></a>
  <nav><a href="./">Games</a><a href="credits.html">Credits</a></nav>
</header>
<main>
  <h1>Tuff Stuff <span>Games</span></h1>
  <p class="sub">Pick a game and play.</p>
  <div id="games"></div>
</main>
<button id="up" title="Back to top" onclick="scrollTo({ top: 0, behavior: 'smooth' })">&uarr;</button>
<script src="games.js"></script>
<script>
  document.getElementById('games').innerHTML = GAMES.map((g) => `
    <div class="card">
      <div class="top"><b>${g.name}</b><span class="tag">${g.tag}</span></div>
      <p>${g.desc}</p>
      <a class="btn" href="play.html?g=${g.slug}">Play now</a>
    </div>`).join('');
  addEventListener('scroll', () => { document.getElementById('up').style.display = scrollY > 400 ? 'block' : 'none'; });
</script>
</html>
